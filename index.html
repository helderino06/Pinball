<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080b14">
<title>Neon Pinball</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="eyebrow">NEON ARCADE</div>
      <h1>PINBALL</h1>
    </div>
    <div class="stats">
      <div><span>PUNTOS</span><b id="score">0</b></div>
      <div><span>MEJOR</span><b id="best">0</b></div>
      <div><span>BOLAS</span><b id="balls">3</b></div>
    </div>
  </header>

  <main>
    <section class="machine">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay">
        <div class="panel">
          <div class="logo">✦</div>
          <h2>NEON PINBALL</h2>
          <p>Desliza o toca los laterales para controlar los flippers.</p>
          <button id="start">JUGAR</button>
        </div>
      </div>
      <div class="hint" id="hint">TOCA IZQUIERDA / DERECHA</div>
    </section>
  </main>

  <footer>
    <button id="pause">Ⅱ</button>
    <span>Mejor puntuación guardada en este iPad</span>
    <button id="sound">🔊</button>
  </footer>
</div>
<script src="game.js"></script>
</body>
</html>
